      <h1 class="hero-title">하나님의 사랑에서<br>끊을 수 없으리라</h1>
      <dl class="hero-info">
        <div><dt>일시</dt><dd><span class="serif">2026.10.12</span>(월)<span class="serif">-17</span>(토) <span class="nowrap">월~금 새벽 5:00, 토 새벽 6:00</span></dd></div>
        <div><dt>장소</dt><dd>더THE사랑교회 본당</dd></div>
      </dl>
      <blockquote class="hero-verse">
        <p>내가 확신하노니 사망이나 생명이나<br>
          천사들이나 권세자들이나 현재 일이나 장래 일이나<br>
          능력이나 높음이나 깊음이나 다른 어떤 피조물이라도<br>

      <p class="board-note">날짜를 눌러 그날의 말씀을 확인하세요.</p>
